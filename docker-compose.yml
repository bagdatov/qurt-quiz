services:
  backend:
    image: golang:1.22-alpine
    working_dir: /app
    command: go run ./cmd/server
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_modules:/root/go/pkg/mod
    environment:
      ADDR: ":8080"
      PACK_DIR: "/app/packs"
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
    environment:
      # Points Vite's server-side proxy at the backend service, not localhost.
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend

volumes:
  go_modules:
  frontend_nm:
